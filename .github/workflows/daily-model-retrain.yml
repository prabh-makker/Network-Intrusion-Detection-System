name: Daily Model Retraining

on:
  schedule:
    - cron: '0 4 * * *'  # 4 AM UTC daily
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install ML deps
        run: |
          cd backend
          pip install -q -r requirements.txt scikit-learn xgboost pandas numpy joblib

      - name: Retrain XGBoost model
        run: |
          cd backend
          python -c "
          import sys
          sys.path.insert(0, '.')
          from app.services.ml_service import train_and_save_model
          try:
              train_and_save_model()
              print('✓ Model retraining complete')
          except Exception as e:
              print(f'⚠ Retrain failed: {e}')
              sys.exit(1)
          "

      - name: Validate model
        run: |
          cd backend
          python -c "
          from app.core.model_loader import load_model_and_metadata
          model, meta = load_model_and_metadata()
          if model:
              print(f'✓ Model loaded: {meta.get(\"model_type\", \"unknown\")}')
          else:
              print('⚠ Model validation failed')
          "

      - name: Commit and push if changed
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          if git diff --exit-code backend/app/models/threat_model.joblib > /dev/null 2>&1; then
              echo "Model unchanged"
          else
              git add backend/app/models/threat_model.joblib backend/app/models/model_metadata.json
              git commit -m "chore: daily model retrain [skip ci]"
              git push
              echo "✓ Model updated and pushed"
          fi

      - name: Report
        if: always()
        run: echo "Daily model retrain complete."
