name: Daily Model Retraining with Mock Data

on:
  schedule:
    - cron: '0 4 * * *'  # 4 AM UTC daily
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install ML + database deps
        run: |
          cd backend
          pip install -q -r requirements.txt scikit-learn xgboost lightgbm pandas numpy joblib sqlalchemy

      - name: Initialize database
        run: |
          cd backend
          python -c "
          from app.db.session import SessionLocal
          from app.db.base_class import Base
          from app.db.session import engine
          Base.metadata.create_all(bind=engine)
          print('✓ Database initialized')
          "

      - name: Generate mock threat data
        run: |
          cd backend
          python -c "
          import sys
          sys.path.insert(0, '.')
          from app.db.session import SessionLocal
          from app.services.mock_data_generator import MockDataGenerator

          db = SessionLocal()
          generator = MockDataGenerator()
          count = generator.generate_dataset(db, n_samples=2000)
          db.close()
          print(f'✓ Generated {count} mock threat samples')
          "

      - name: Automated daily training with validation
        run: |
          cd backend
          python scripts/daily_auto_train.py

      - name: Validate trained model
        run: |
          cd backend
          python -c "
          from app.core.model_loader import load_model_and_metadata
          model, meta = load_model_and_metadata()
          if model and meta:
              print(f'✓ Model: {meta.get(\"model_type\", \"unknown\")}')
              print(f'✓ Accuracy: {meta.get(\"test_accuracy\", 0)*100:.2f}%')
              print(f'✓ Features: {meta.get(\"n_features\", 0)}')
          else:
              print('⚠ Model validation failed')
              exit(1)
          "

      - name: Report metrics
        if: always()
        run: |
          echo "Daily Training Complete"
          echo "- Mock data: 2000 samples"
          echo "- Attack distribution: 20% attacks, 80% normal"
          echo "- Model: XGBoost with comprehensive features"
          echo "- Next run: Tomorrow 4 AM UTC"

      - name: Commit model if improved
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions (Auto-Train)"
          git add -A backend/app/models/ 2>/dev/null || true
          if git diff --cached --exit-code > /dev/null 2>&1; then
              echo "No model changes"
          else
              git commit -m "chore: daily auto-train with mock data [skip ci]" || true
              git push || true
          fi
